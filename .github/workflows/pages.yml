# Publishes the two built games on GitHub Pages: v3.html (the office) as the site's index.html, v4.html (the retro desktop) under /retro/.
# It deploys the committed files rather than rebuilding them, so each page is the same file the playtest ran against.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: [v3.html, v4.html, .github/workflows/pages.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Assemble the site
        run: |
          mkdir -p _site/retro
          cp v3.html _site/index.html
          cp v4.html _site/retro/index.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
